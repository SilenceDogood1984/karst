name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true
      - name: Run RuboCop
        run: bundle exec rubocop

  unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true
      - name: Run RSpec
        env:
          RUBYOPT: -W:deprecated
        run: bundle exec rspec --exclude-pattern "spec/integration/**/*_spec.rb"

  rails-integration:
    name: Rails ${{ matrix.rails }} / Ruby ${{ matrix.ruby }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - rails: "6.1"
            ruby: "2.7"
            gemfile: rails_6_1.gemfile
          - rails: "7.0"
            ruby: "3.2"
            gemfile: rails_7_0.gemfile
          - rails: "7.1"
            ruby: "3.2"
            gemfile: rails_7_1.gemfile
          - rails: "7.2"
            ruby: "3.3"
            gemfile: rails_7_2.gemfile
          - rails: "8.0"
            ruby: "3.3"
            gemfile: rails_8_0.gemfile
    env:
      BUNDLE_GEMFILE: ${{ github.workspace }}/gemfiles/${{ matrix.gemfile }}
      EXPECTED_RAILS_VERSION: ${{ matrix.rails }}
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
          cache-version: rails-${{ matrix.rails }}
      - name: Run Rails integration specs
        run: |
          bundle exec rspec spec/integration --exclude-pattern \
            "spec/integration/{devise_golden_path_integration_spec.rb,multi_devise_golden_path_integration_spec.rb,custom_auth_golden_path_integration_spec.rb}"
      # Separate process: this spec boots a second, real Rails::Application
      # (with the real `devise` gem, and Active Record) alongside
      # KarstTestApplication, and two independently booted
      # Rails::Application instances that both mount active_record/railtie
      # are not safe to share Rails::Engine's own class-level
      # initialization state within one process -- see bin/test-rails.
      - name: Run Devise/Warden golden-path smoke test (no Karst configuration)
        run: bundle exec rspec spec/integration/devise_golden_path_integration_spec.rb
      # Same reason, its own process again: a real multi-mapping Devise
      # application cannot share a process with the single-model one above
      # either -- see bin/test-rails.
      - name: Run multi-Devise golden-path smoke test (no Karst configuration)
        run: bundle exec rspec spec/integration/multi_devise_golden_path_integration_spec.rb
      # Same reason again: this fixture also mounts active_record/railtie on
      # its own Rails::Application (custom, non-Devise authentication), so
      # it gets the same isolated process -- see bin/test-rails.
      - name: Run custom-auth golden-path smoke test (no Karst configuration)
        run: bundle exec rspec spec/integration/custom_auth_golden_path_integration_spec.rb
