name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true
      - name: Run RuboCop
        run: bundle exec rubocop

  unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true
      - name: Run RSpec
        env:
          RUBYOPT: -W:deprecated
        run: bundle exec rspec --exclude-pattern "spec/integration/**/*_spec.rb"

  rails-integration:
    name: Rails ${{ matrix.rails }} / Ruby ${{ matrix.ruby }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - rails: "6.1"
            ruby: "2.7"
            gemfile: rails_6_1.gemfile
          - rails: "7.0"
            ruby: "3.2"
            gemfile: rails_7_0.gemfile
          - rails: "7.1"
            ruby: "3.2"
            gemfile: rails_7_1.gemfile
          - rails: "7.2"
            ruby: "3.3"
            gemfile: rails_7_2.gemfile
          - rails: "8.0"
            ruby: "3.3"
            gemfile: rails_8_0.gemfile
    env:
      BUNDLE_GEMFILE: ${{ github.workspace }}/gemfiles/${{ matrix.gemfile }}
      EXPECTED_RAILS_VERSION: ${{ matrix.rails }}
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
          cache-version: rails-${{ matrix.rails }}
      - name: Run Rails integration specs
        run: bundle exec rspec spec/integration --exclude-pattern "spec/integration/devise_golden_path_integration_spec.rb"
      # Separate process: this spec boots a second, real Rails::Application
      # (with the real `devise` gem) alongside KarstTestApplication, and two
      # independently booted Rails::Application instances are not safe to
      # share Rails::Engine's own class-level initialization state within
      # one process -- see bin/test-rails.
      - name: Run Devise/Warden golden-path smoke test (no Karst configuration)
        run: bundle exec rspec spec/integration/devise_golden_path_integration_spec.rb
