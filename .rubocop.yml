AllCops:
  NewCops: enable
  # A standalone, dev-only measurement script -- not shipped in the gem (see
  # karst.gemspec's file list) and not subject to the same architectural
  # constraints (method length, one-class-per-file) as the library it
  # measures.
  Exclude:
    - "benchmark/**/*"
  # This is the Ruby the lint job itself runs (and the syntax ceiling
  # RuboCop's own parser must accept across the whole repo, including
  # modern-only test fixtures) -- not Karst's compatibility floor. Karst
  # supports Ruby >= 2.7 (see gemspec/CI); production code on that path is
  # kept 2.7-safe by hand, with narrow rubocop:disable comments where a cop
  # would otherwise suggest newer-only syntax.
  TargetRubyVersion: 3.2
  SuggestExtensions: false

Style/StringLiterals:
  EnforcedStyle: double_quotes

# Deliberately mismatched: required_ruby_version (2.7) is Karst's real
# compatibility floor, while TargetRubyVersion (3.2) above is the lint job's
# own Ruby / the syntax ceiling for modern-only test fixtures. This cop
# assumes the two are the same thing, which they intentionally are not here.
Gemspec/RequiredRubyVersion:
  Enabled: false
